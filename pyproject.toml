[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathplotgame"
version = "0.1.0"
description = "Interactive matplotlib-compatible graphs rendered with pygame"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.4.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gif   = ["Pillow>=9.0"]
video = ["imageio[ffmpeg]>=2.20"]
export = ["Pillow>=9.0", "imageio[ffmpeg]>=2.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/mathplotgame"]
include = ["src/mathplotgame/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
