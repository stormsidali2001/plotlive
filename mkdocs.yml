site_name: plotlive
site_description: Interactive matplotlib-compatible graphs rendered with pygame
site_url: https://stormsidali2001.github.io/plotlive
repo_url: https://github.com/stormsidali2001/plotlive
repo_name: stormsidali2001/plotlive

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            heading_level: 2
            docstring_options:
              warn_unknown_params: false

nav:
  - Home: index.md
  - Examples: examples.md
  - API Reference:
      - pyplot: api/pyplot.md
      - animation: api/animation.md
      - figure & axes: api/figure.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - attr_list
